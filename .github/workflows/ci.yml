name: Verificación automática de AnimaArgenta

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repo
      uses: actions/checkout@v3

    - name: Instalar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Instalar dependencias
      run: npm install

    - name: Verificar build
      run: npm run build

    - name: Generar XDR de los cinco NFT pendientes
      run: npm run nft:preview -- batches/belgica-1960.batch.json --xdr

    - name: Guardar XDR sin firmar
      uses: actions/upload-artifact@v4
      with:
        name: anima-argenta-mint-xdr
        path: batch-preview/lote-plata-01/*.xdr
        retention-days: 1
